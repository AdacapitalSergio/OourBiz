name: Deploy Frontend OurBiz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci || npm install

      - name: 🔨 Compilar Frontend (Vite)
        run: npm run build

      - name: 🔑 Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy dos ficheiros estáticos para a VPS
        run: |
          # 1. Criar backup do dist atual no servidor antes de atualizar
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            if [ -d /opt/Front_ourbiz/dist ]; then
              cp -r /opt/Front_ourbiz/dist /opt/Front_ourbiz/dist_bkp_\$(date +%Y%m%d_%H%M%S)
              ls -dt /opt/Front_ourbiz/dist_bkp_* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true
            fi
            mkdir -p /opt/Front_ourbiz/dist
          "

          # 2. Sincronizar ficheiros compilados via rsync
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/Front_ourbiz/dist/

      - name: 🔄 Sincronizar repositório fonte na VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            if [ -d /opt/src_ourbiz/.git ]; then
              cd /opt/src_ourbiz
              git fetch origin main
              git reset --hard origin/main
            fi
          "
